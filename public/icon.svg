<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E2723" />
      <stop offset="50%" stop-color="#4A2E2B" />
      <stop offset="100%" stop-color="#2C1810" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7CE" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="blushGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBECEB" />
      <stop offset="50%" stop-color="#ECC3BD" />
      <stop offset="100%" stop-color="#D99B90" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base with subtle luxury texture -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer delicate gold border -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.8" />
  <rect x="36" y="36" width="440" height="440" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Central Yarn Ball & Crochet Loops Motif -->
  <g transform="translate(256, 215)">
    <!-- Yarn ball outer loops -->
    <circle cx="0" cy="0" r="105" fill="#FAF7F2" opacity="0.08" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#blushGrad)" stroke-width="14" stroke-linecap="round" />
    <ellipse cx="-15" cy="-10" rx="75" ry="50" fill="none" stroke="#FAF7F2" stroke-width="9" stroke-linecap="round" opacity="0.85" transform="rotate(-25)" />
    <ellipse cx="12" cy="12" rx="75" ry="52" fill="none" stroke="url(#blushGrad)" stroke-width="9" stroke-linecap="round" opacity="0.9" transform="rotate(35)" />
    <ellipse cx="0" cy="0" rx="82" ry="40" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.95" transform="rotate(75)" />
    
    <!-- Delicate stitched crochet strand curving out -->
    <path d="M 60,60 C 95,90 120,60 140,85 C 155,105 130,135 150,150" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 7" />

    <!-- Stylized Crochet Hook through the yarn ball -->
    <g transform="rotate(-42)">
      <!-- Hook shaft -->
      <path d="M 0,-155 L 0,145" stroke="url(#goldGrad)" stroke-width="11" stroke-linecap="round" filter="url(#softGlow)" />
      <!-- Hook tip / throat -->
      <path d="M 0,-155 C -6,-165 -16,-170 -16,-180 C -16,-190 -6,-192 2,-187 C 8,-183 9,-173 1,-168" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Hook grip notch -->
      <rect x="-8" y="10" width="16" height="50" rx="6" fill="#D4AF37" opacity="0.6" />
    </g>

    <!-- Center Monogram "B & M" -->
    <circle cx="0" cy="2" r="50" fill="#2C1810" opacity="0.92" />
    <circle cx="0" cy="2" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="0" y="12" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" fill="url(#blushGrad)" text-anchor="middle" letter-spacing="1">B&amp;M</text>
  </g>

  <!-- Typography: B & M CROCHET HOUSE -->
  <text x="256" y="385" font-family="'Cormorant Garamond', Georgia, serif" font-size="36" font-weight="700" fill="#FAF7F2" text-anchor="middle" letter-spacing="4">B &amp; M</text>
  <text x="256" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">CROCHET HOUSE</text>
  <text x="256" y="445" font-family="'Cormorant Garamond', Georgia, serif" font-size="15" font-style="italic" fill="#ECC3BD" text-anchor="middle" letter-spacing="1">Handmade with love, crafted with care</text>
</svg>
